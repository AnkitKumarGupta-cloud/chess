  const recs=LV.recs[c.id];
  return `<div class="card stack classcard" data-class="${esc(c.id)}">
    <div class="row">${state}<span class="pill">${esc(c.batchName||c.batch)}</span><span class="pill mono">${c.durationMin} min</span></div>
    <h2>${esc(c.title)}</h2><p class="li-m">${esc(whenText(c.startsAt))}</p>
    <div class="row">${join}<button class="btn ghost" data-recs="${esc(c.id)}">${recs?"Refresh recordings":"Show recordings"}</button>${teacher?`<button class="btn ghost" data-del="${esc(c.id)}">Delete</button>`:""}</div>
    ${recs?(recs.error?`<p class="feedback no">${esc(recs.error)}</p>`:recs.list.length?`<ul class="reclist">${recs.list.map(r=>`<li><button data-play="${esc(c.id)}|${esc(r.id)}">▶ Recording${recs.list.length>1?` part ${r.part}`:""} <span class="li-m">${durText(r.durationSec)}</span></button></li>`).join("")}</ul>`:`<p class="li-m">No recording yet. It appears a few minutes after the class ends.</p>`):""}
    ${LV.player&&LV.player.classId===c.id?`<video class="recvideo" controls autoplay playsinline src="${esc(LV.player.url)}"></video>`:""}
  </div>`;
}
function accountCard(a){return `<div class="acct"><div><b>${esc(a.name)}</b> <span class="pill">${ROLE_NAME[a.role]}</span></div>
  <div class="acct-cred"><span class="li-m">Username</span><code>${esc(a.username)}</code><span class="li-m">Password</span><code>${esc(a.password)}</code></div>
  <button class="btn ghost" type="button" data-copy="${esc(waText(a))}">Copy message for WhatsApp</button></div>`}
function liveHome(root){
  const u=AUTH.user,teacher=u.role==="teacher",cs=LV.classes||[],users=LV.users||[];
  const now=cs.filter(c=>c.live),next=cs.filter(c=>!c.live&&!c.ended).reverse(),past=cs.filter(c=>!c.live&&c.ended);
  const group=(t,list,empty)=>`<section class="stack"><h2>${t}</h2>${list.length?`<div class="grid g2">${list.map(c=>classCard(c,u)).join("")}</div>`:`<p class="li-m">${empty}</p>`}</section>`;
  const batches=[...new Set([...cs.map(c=>c.batchName||c.batch),...users.map(x=>x.batchName||x.batch)].filter(Boolean))];
  root.innerHTML=`
  <div class="row" style="justify-content:space-between"><p class="li-m">${teacher?"Signed in as teacher.":u.role==="parent"?`Parent view. You can see the schedule and watch recordings of ${esc(u.name)}'s classes.`:`You're in batch “${esc(u.batchName||u.batch)}”. Join when your class is live.`}</p>
    <button class="btn ghost" id="lvRefresh">Refresh</button></div>
  ${teacher&&!LV.recReady?`<div class="feedback">Recording is off for now, so classes will not be saved for students to watch later. Live classes work normally.</div>`:""}
  ${teacher?`<div class="grid g2">
    <form class="card stack" id="lvNew"><h2>Schedule a class</h2>
      <label class="fld"><span>Class title</span><input id="lvTitle" placeholder="Knight forks practice" required maxlength="80"></label>
      <label class="fld"><span>Batch</span><input id="lvBatch" placeholder="Beginners Saturday" required maxlength="40" list="lvBatches"></label>
      <datalist id="lvBatches">${batches.map(b=>`<option value="${esc(b)}">`).join("")}</datalist>
      <div class="row"><label class="fld" style="flex:2;min-width:180px"><span>Date and time</span><input id="lvAt" type="datetime-local" required></label>
      <label class="fld" style="flex:1;min-width:110px"><span>Minutes</span><input id="lvDur" type="number" min="15" max="240" step="5" value="60" required></label></div>
      <button class="btn" type="submit">Add class</button><p class="li-m" id="lvNewMsg" role="status"></p></form>
    <form class="card stack" id="lvInv"><h2>Add a student</h2>
      <label class="fld"><span>Student's name</span><input id="lvSName" required maxlength="40"></label>
      <label class="fld"><span>Batch</span><input id="lvSBatch" required maxlength="40" list="lvBatches"></label>
      <button class="btn" type="submit">Create logins</button><p class="li-m" id="lvInvMsg" role="status"></p>
      ${LV.accounts?`<div class="stack codes"><b>Save these now. Passwords are only shown once.</b>${LV.accounts.map(accountCard).join("")}</div>`:""}</form>
  </div>
  <section class="card stack"><h2>Students</h2>${users.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Batch</th><th>Username</th><th>Who</th><th></th></tr></thead><tbody>${users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.batchName||x.batch)}</td><td class="mono">${esc(x.username)}</td><td>${ROLE_NAME[x.role]}</td><td class="acts"><button class="btn ghost sm" data-reset="${esc(x.username)}">New password</button><button class="btn ghost sm" data-rm="${esc(x.username)}">Remove</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="li-m">No students yet. Add the first one above.</p>`}</section>`:""}
  ${now.length?group("Live now",now,""):""}
  ${group("Upcoming classes",next,teacher?"No classes scheduled. Add one above.":"No upcoming classes yet. Your teacher will add them here.")}
  ${group(teacher?"Past classes":"Past classes and recordings",past,"Finished classes and their recordings will show up here.")}`;
  $("#lvRefresh").onclick=()=>{LV.classes=null;LV.users=null;render()};
  root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy).then(()=>toast("Copied")).catch(()=>toast("Press and hold to copy"))});
  if(teacher){
    const at=$("#lvAt");if(!at.value){const d=new Date(Date.now()+3600000);d.setMinutes(0,0,0);at.value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
    $("#lvNew").onsubmit=async e=>{e.preventDefault();const m=$("#lvNewMsg");m.textContent="Adding…";
      try{const r=await liveApi("/classes",{method:"POST",body:{title:$("#lvTitle").value,batch:$("#lvBatch").value,startsAt:new Date($("#lvAt").value).toISOString(),durationMin:+$("#lvDur").value}});const nc=r.class,end=new Date(nc.startsAt).getTime()+(nc.durationMin+30)*60000;LV.classes=[{...nc,live:false,ended:Date.now()>end},...(LV.classes||[])].sort((a,b)=>new Date(b.startsAt)-new Date(a.startsAt));toast("Class added");render()}catch(err){m.textContent=err.message}};
    $("#lvInv").onsubmit=async e=>{e.preventDefault();const m=$("#lvInvMsg");m.textContent="Creating…";
      try{LV.accounts=(await liveApi("/users",{method:"POST",body:{name:$("#lvSName").value,batch:$("#lvSBatch").value,withParent:false}})).accounts;LV.users=[...(LV.users||[]),...LV.accounts.map(a=>({username:a.username,name:a.name,role:a.role,batch:(a.batch||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""),batchName:a.batch}))];render()}catch(err){m.textContent=err.message}};
    root.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}
      try{await liveApi("/classes?id="+encodeURIComponent(b.dataset.del),{method:"DELETE"});LV.classes=(LV.classes||[]).filter(c=>c.id!==b.dataset.del);toast("Class deleted");render()}catch(err){toast(err.message)}});
    root.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again";return}
      try{LV.accounts=[await liveApi("/users",{method:"POST",body:{action:"reset",username:b.dataset.reset}})];render()}catch(err){toast(err.message)}});
    root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to remove";return}
      try{await liveApi("/users?username="+encodeURIComponent(b.dataset.rm),{method:"DELETE"});LV.users=(LV.users||[]).filter(u=>u.username!==b.dataset.rm);toast("Account removed");render()}catch(err){toast(err.message)}});
  }
  root.querySelectorAll("[data-recs]").forEach(b=>b.onclick=async()=>{const id=b.dataset.recs;b.textContent="Loading…";
    try{LV.recs[id]={list:(await liveApi("/recordings?classId="+encodeURIComponent(id))).recordings}}catch(err){LV.recs[id]={error:err.message,list:[]}}liveHome(root)});
  root.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const [cid,rid]=b.dataset.play.split("|");const r=(LV.recs[cid]&&LV.recs[cid].list||[]).find(x=>x.id===rid);if(r){LV.player={classId:cid,url:r.url};liveHome(root)}});
}

/* ---------- Router ---------- */
const VIEWS={plevel:[vPlevel,afterPlevel],classic:[vClassic,afterClassic],practice:[vPractice,afterPractice],drill:[vDrill,afterDrill],live:[vLive,afterLive],home:[vHome,afterHome],courses:[vCourses],lesson:[vLesson,afterLesson],puzzles:[vPuzzles,afterPuzzles],tests:[vTests,afterTests],progress:[vProgress,afterProgress]};
function route(){const h=(location.hash||"#home").slice(1).split("?")[0];return VIEWS[h]?h:"home"}
function render(){
  document.body.classList.toggle("gated",AUTH.state!=="in"&&AUTH.state!=="guest");renderWho();
  if(AUTH.state!=="in"&&AUTH.state!=="guest"){stopLesson();$("#app").innerHTML=authView();bindAuth();return}
  if(!HAS_CHESS){$("#app").innerHTML=`<div class="card"><h2>The chess engine didn't load</h2><p class="li-m" style="margin-top:8px">Check your connection and reload the page.</p></div>`;return}
  const r=route();document.body.dataset.route=r;if(r!=="lesson")stopLesson();
  const [v,a]=VIEWS[r];$("#app").innerHTML=v();a&&a();
  const tab=r==="lesson"?"courses":r==="drill"?"practice":(r==="plevel"||r==="classic")?"puzzles":r;
  document.querySelectorAll("#tabs a").forEach(x=>{if(x.getAttribute("href")==="#"+tab)x.setAttribute("aria-current","page");else x.removeAttribute("aria-current")});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{curLesson=b.dataset.open;if(location.hash==="#lesson")render();else location.hash="lesson";window.scrollTo(0,0)});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
}
window.addEventListener("hashchange",()=>{if(route()==="lesson"&&!curLesson)curLesson=ALL_LESSONS[0].id;render();window.scrollTo(0,0)});
if(route()==="lesson")curLesson=ALL_LESSONS[0].id;
authCheck();
</script>
</body>

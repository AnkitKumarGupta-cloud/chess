<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Sathi</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#C8323C">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess Sathi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — top bar on desktop, bottom tab bar on phones; content column max 1080px; boards are the hero object */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6878; --line:#DDE3EA;
  --accent:#C8323C; --accent-ink:#FFFFFF; --accent-soft:#F8E3E4;
  --sq-light:#DCE3EA; --sq-dark:#7C93A8; --sq-hi:#E9B949; --sq-sel:#5FA8D3;
  --good:#2F8A55; --good-soft:#DFF1E6; --warn:#B26B00;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E7ECF2; --muted:#94A3B4; --line:#2A3542;
  --accent:#E5525B; --accent-ink:#FFFFFF; --accent-soft:#3A1E22;
  --sq-light:#9FB1C2; --sq-dark:#4E6378; --sq-hi:#D9A93A; --sq-sel:#3F8FC0;
  --good:#4CC27F; --good-soft:#163527; --warn:#E3A13A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E7ECF2; --muted:#94A3B4; --line:#2A3542;
  --accent:#E5525B; --accent-ink:#FFFFFF; --accent-soft:#3A1E22;
  --sq-light:#9FB1C2; --sq-dark:#4E6378; --sq-hi:#D9A93A; --sq-sel:#3F8FC0;
  --good:#4CC27F; --good-soft:#163527; --warn:#E3A13A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.5rem,4vw,2.2rem)} h2{font-size:1.15rem} h3{font-size:1rem;font-family:var(--f-body)}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sq-sel);outline-offset:2px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:24px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.logo b{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--bg)}
nav.tabs a svg{width:18px;height:18px}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:6}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px}
  main{padding-bottom:90px!important}
}

main{max-width:1080px;margin:0 auto;padding-block:28px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.level{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lead{color:var(--muted);font-size:1.05rem;max-width:52ch;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{border-left:3px solid var(--line);padding-left:12px}
.stat .n{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Board */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;container-type:inline-size;width:100%;max-width:440px;border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line);user-select:none;-webkit-user-select:none;position:relative}
.sq{position:relative;aspect-ratio:1;min-width:0;min-height:0;overflow:visible;display:flex;align-items:center;justify-content:center;border:0;padding:0;background:var(--sq-light);cursor:default}
.sq.d{background:var(--sq-dark)}
.sq.hi::after{content:"";position:absolute;inset:0;background:var(--sq-hi);opacity:.55}
.sq.sel::after{content:"";position:absolute;inset:0;background:var(--sq-sel);opacity:.6}
.sq.bad::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:.55}
.board.live .sq{cursor:pointer}
.pc{position:relative;z-index:1;font-size:9.5cqw;line-height:1;pointer-events:none}
.pc.w{color:#FFFFFF;text-shadow:0 0 1px #111,0 0 1px #111,0 1px 2px rgba(0,0,0,.5)}
.pc.b{color:#11151A;text-shadow:0 0 1px rgba(255,255,255,.35)}
.coord{position:absolute;font-size:.6rem;font-family:var(--f-mono);font-weight:500;opacity:.75;z-index:1;pointer-events:none}
.coord.f{right:3px;bottom:1px} .coord.r{left:3px;top:1px}
.sq .coord{color:var(--sq-dark)} .sq.d .coord{color:var(--sq-light)}

/* Courses */
.course{display:flex;flex-direction:column;gap:12px}
.course .meta{display:flex;gap:8px;flex-wrap:wrap}
.course ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.course li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.course li button:hover{color:var(--accent)}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.li-t{flex:1;min-width:0} .li-m{font-size:.78rem;color:var(--muted)}

.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:32px;align-items:start}
@media (max-width:820px){.lesson{grid-template-columns:1fr}}
.lesson .body{display:flex;flex-direction:column;gap:14px;max-width:62ch}
.lesson .body p{font-size:1rem}
.caption{font-size:.85rem;color:var(--muted);margin-top:10px;max-width:440px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;display:inline-flex;gap:6px;align-items:center}
.keypoint{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-weight:500}

/* Puzzles */
.pz{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.pz{grid-template-columns:1fr}}
.feedback{padding:12px 14px;border-radius:8px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.feedback.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.feedback.no{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pzlist{display:flex;gap:8px;flex-wrap:wrap}
.pzlist button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-mono)}
.pzlist button.cur{border-color:var(--accent);color:var(--accent);border-width:2px}
.pzlist button.solved{background:var(--good-soft);color:var(--good);border-color:transparent}
.tomove{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tomove i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.tomove i.w{background:#fff} .tomove i.b{background:#11151A}

/* Test */
.q{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt:disabled{cursor:default}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
@media (max-width:720px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* Video player */
.player{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.screen .board{max-width:none}
.subtitle{min-height:72px;background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:1rem}
.subtitle b{color:var(--accent)}
.scrub{display:flex;gap:3px}
.scrub button{flex:1;background:none;border:0;padding:8px 0}
.scrub i{display:block;height:4px;border-radius:2px;background:var(--line)}
.scrub i{position:relative;overflow:hidden}.scrub i::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0))}
.scrub button.on i{background:var(--accent)}
.scrub button.on i::after{display:none}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);font-weight:800}
.ctl.big{width:54px;height:54px;background:var(--accent);color:var(--accent-ink);font-size:1.1rem}
.ctl.txt{width:auto;padding:0 12px;border-radius:99px;font-family:var(--f-mono)}
.transcript{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.transcript button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 6px;color:var(--muted);font-size:.92rem;line-height:1.45}
.transcript button.cur{color:var(--ink);background:var(--accent-soft)}
.transcript b{color:var(--accent)}
.lesson{grid-template-columns:minmax(0,520px) minmax(0,1fr)!important}
@media (max-width:820px){.lesson{grid-template-columns:1fr!important}}
.tick.play{border-color:var(--accent)}
.tick.play::after{content:"";border-left:7px solid var(--accent);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
.sq.dot::before{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(0,0,0,.28);z-index:2}
.chips{gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.88rem}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .mono{font-size:.75rem;opacity:.8}

.sq.moving{z-index:5}
.pc.slide{transition:transform .24s cubic-bezier(.3,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.pc.slide{transition:none}}
.toggles{display:flex;gap:6px}
nav.tabs + .toggles{margin-left:8px}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 10px;font-weight:600;font-size:.8rem}
.tog svg{width:16px;height:16px}
.tog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:720px){.toggles{margin-left:auto!important}.tog span{display:none}}
.voice-note{font-size:.8rem;color:var(--muted)}

/* Live classes */
.fld{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;min-width:0}
.fld input{font:inherit;font-weight:400;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.fld input:focus-visible{outline:3px solid var(--sq-sel);outline-offset:1px}
.pill.live{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.reclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.reclist button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;color:var(--ink);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.reclist button:hover{color:var(--accent)}
.recvideo{width:100%;max-width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
.codes{border-top:1px solid var(--line);padding-top:12px}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:720px){nav.tabs a{padding:6px 4px!important;font-size:.64rem!important}}

/* ===== Design polish, sign-in screen, account menu ===== */
:root{--shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px rgba(22,32,43,.06);--shadow-up:0 2px 4px rgba(22,32,43,.08),0 14px 34px rgba(22,32,43,.12);--glow:rgba(200,50,60,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);--shadow-up:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.4);--glow:rgba(229,82,91,.16)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);--shadow-up:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.4);--glow:rgba(229,82,91,.16)}
body{background:radial-gradient(900px 420px at 85% -80px,var(--glow),transparent 70%),var(--bg);background-attachment:fixed}
/* no backdrop-filter here: it would trap the fixed phone tab bar inside the header */
.topbar{box-shadow:0 1px 0 var(--line),0 6px 18px rgba(22,32,43,.04)}
.card{box-shadow:var(--shadow);border-radius:16px;transition:transform .18s ease,box-shadow .18s ease}
.course.card:hover,.grid>.card.stack:hover{box-shadow:var(--shadow-up)}
.btn{border-radius:10px;padding:11px 18px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 6px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.ghost{box-shadow:none;background:var(--surface)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
nav.tabs a{transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent-soft) 55%,var(--surface)));border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,40px);box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.7rem,4.6vw,2.6rem)}
.stat{border-left:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pill.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.pill.live{animation:none}}
.eyebrow{color:var(--accent)}
.reclist button,.course li button{transition:color .12s}
.classcard{border-left:4px solid var(--line)}
.classcard:has(.pill.live){border-left-color:var(--accent)}

/* Sign-in screen */
body.gated nav.tabs,body.gated .toggles{display:none}
.login{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;min-height:calc(100dvh - 140px)}
@media (max-width:820px){.login{grid-template-columns:1fr;min-height:0;gap:20px}.login-art{display:none}}
.login-art{padding:clamp(8px,2vw,24px)}
.login-art h1{font-size:clamp(2rem,5vw,3.2rem);max-width:14ch}
.login-art ul{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:1.02rem}
.login-art li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:middle}
.login-glyph{font-size:clamp(4rem,9vw,6.5rem);line-height:1;color:var(--accent);margin-bottom:8px;filter:drop-shadow(0 10px 24px var(--glow))}
.login-card{max-width:440px;width:100%;justify-self:center;padding:clamp(20px,4vw,32px);gap:16px}
.pwrow{display:flex;gap:8px;align-items:stretch;font-weight:400}
.pwrow input{flex:1}
.pwtog{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:0 12px;font-weight:600;font-size:.8rem}
.fld input{border-radius:10px;padding:12px 13px;font-size:1rem}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:500}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Account menu */
.who{position:relative;margin-left:auto}
.chipbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:.86rem}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-up);padding:6px;z-index:30;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu-h{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;color:var(--ink);font-weight:600}
.menu button:hover{background:var(--bg)}
@media (max-width:720px){.whoname{display:none}.chipbtn{padding:3px}.who{margin-left:auto}.topbar-in{gap:12px!important}}
body.gated .who{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{width:min(420px,100%);box-shadow:var(--shadow-up)}
.feedback[hidden]{display:none}

/* Teacher tools */
.acct{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.acct-cred{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.acct-cred code{font-family:var(--f-mono);font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;justify-self:start;user-select:all}
.tablewrap{overflow-x:auto}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn{margin-left:6px}

/* =====================================================================
   Chess Sathi 2026 design: calm warm surfaces, bento dashboard,
   learning path, XP + streak + chess-piece ranks, sidebar on computers.
   ===================================================================== */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#F1EEE7; --ink:#1B1E25; --muted:#646B77; --line:#E5E1D7;
  --accent:#D2373F; --accent-ink:#FFFFFF; --accent-soft:#FBE8E6;
  --gold:#D99520; --gold-soft:#FCF1DC; --good:#2E8B57; --good-soft:#E2F3E8; --warn:#B26B00;
  --sq-light:#E9E4D8; --sq-dark:#8FA3B5; --sq-hi:#F0C25A; --sq-sel:#6AAED9;
  --shadow:0 1px 2px rgba(27,30,37,.05),0 6px 20px rgba(27,30,37,.05);
  --shadow-up:0 2px 6px rgba(27,30,37,.07),0 16px 40px rgba(27,30,37,.10);
  --glow:rgba(210,55,63,.10); --radius:20px; --side:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161C24; --surface-2:#1C242F; --ink:#ECEFF3; --muted:#9AA4B2; --line:#26303C;
  --accent:#EF5A62; --accent-soft:#3A1D22; --gold:#F2B544; --gold-soft:#3A2E17; --good:#4CC27F; --good-soft:#15301F;
  --sq-light:#A9B7C4; --sq-dark:#55697D; --sq-hi:#D9A93A; --sq-sel:#3F8FC0;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); --shadow-up:0 2px 6px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.4); --glow:rgba(239,90,98,.10)}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C24; --surface-2:#1C242F; --ink:#ECEFF3; --muted:#9AA4B2; --line:#26303C;
  --accent:#EF5A62; --accent-soft:#3A1D22; --gold:#F2B544; --gold-soft:#3A2E17; --good:#4CC27F; --good-soft:#15301F;
  --sq-light:#A9B7C4; --sq-dark:#55697D; --sq-hi:#D9A93A; --sq-sel:#3F8FC0;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); --shadow-up:0 2px 6px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.4); --glow:rgba(239,90,98,.10)}
body{background:radial-gradient(1000px 520px at 100% -120px,var(--glow),transparent 70%),var(--bg);font-size:15.5px}
h1{font-size:clamp(1.55rem,3.6vw,2.25rem);letter-spacing:-.01em}
h2{font-size:1.12rem}
.eyebrow{color:var(--muted);letter-spacing:.1em}
.card{border-radius:var(--radius);border-color:var(--line);box-shadow:var(--shadow)}
.btn{border-radius:12px;font-weight:700;padding:11px 18px}
.btn.big{padding:14px 22px;font-size:1rem;border-radius:14px}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.link{color:var(--accent);font-weight:700;text-decoration:none}
.link:hover{text-decoration:underline}
.pill{border-radius:99px;font-weight:700}
.bar{height:8px;background:var(--surface-2);border:0}
.bar.gold i{background:linear-gradient(90deg,var(--gold),#F7CD6B)}
.ring-bg{fill:none;stroke:var(--surface-2)}
.ring-fg{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
main{gap:26px;padding-block:28px 72px}

/* --- Navigation: sidebar on computers, bottom tabs on phones --- */
.topbar{box-shadow:none;background:color-mix(in srgb,var(--surface) 92%,transparent)}
nav.tabs a{border-radius:12px;font-weight:600}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (min-width:1100px){
  body{padding-left:var(--side)}
  .topbar{position:fixed;left:0;top:0;bottom:0;width:var(--side);border-bottom:0;border-right:1px solid var(--line);background:var(--surface)}
  .topbar-in{height:100%;flex-direction:column;align-items:stretch;gap:6px;padding:22px 14px 16px;max-width:none}
  .logo{padding:4px 10px 18px;font-size:1.12rem}
  nav.tabs{flex-direction:column;margin:0;gap:4px}
  nav.tabs a{padding:12px 14px;font-size:.98rem;gap:12px}
  nav.tabs a svg{width:21px;height:21px}
  nav.tabs + .toggles{margin:auto 0 0;padding:12px 4px 4px;border-top:1px solid var(--line)}
  .toggles{flex-wrap:wrap}
  .who{margin:auto 0 0}
  .who .chipbtn{width:100%;justify-content:flex-start;border-radius:14px;padding:6px}
  .who .menu{top:auto;bottom:calc(100% + 8px);left:0;right:auto;width:100%}
  main{max-width:1120px;padding-inline:32px}
}
@media (max-width:720px){
  nav.tabs{background:color-mix(in srgb,var(--surface) 96%,transparent);box-shadow:0 -6px 24px rgba(0,0,0,.08);border-top:1px solid var(--line)}
  nav.tabs a{border-radius:12px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
}

/* --- Greeting row --- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h1{max-width:24ch;margin-top:6px}
.hello-chips{display:flex;gap:8px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:.84rem;color:var(--muted);box-shadow:var(--shadow)}
.hchip b{color:var(--ink);font-size:.95rem}
.hchip.streak.lit{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.hchip.rank b{font-size:1.1rem;line-height:1}

/* --- Bento dashboard --- */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;grid-auto-flow:dense}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease}
.tile:hover{box-shadow:var(--shadow-up)}
.tile h3{font-family:var(--f-display);font-size:1rem}
.tile-top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.tile-h{font-size:clamp(1.25rem,2.4vw,1.65rem);max-width:20ch;position:relative;z-index:1}
.t-continue{grid-column:span 4;min-height:250px;padding:26px;background:linear-gradient(140deg,var(--surface) 30%,color-mix(in srgb,var(--accent-soft) 70%,var(--surface)))}
.t-continue .row{position:relative;z-index:1}
.tile-art{position:absolute;right:-10px;bottom:-34px;font-size:13rem;line-height:1;color:var(--accent);opacity:.12;pointer-events:none;transform:rotate(-8deg)}
.minibar{display:flex;align-items:center;gap:8px;min-width:140px;flex:1;max-width:220px}
.minibar .bar{flex:1}
.t-goal{grid-column:span 2}
.goal{position:relative;width:72px;height:72px}
.goal-n{position:absolute;inset:0;display:grid;place-items:center;align-content:center;line-height:1}
.goal-n b{font-size:1.15rem}.goal-n span{font-size:.7rem;color:var(--muted)}
.t-goal .ring-fg{stroke:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:64px;margin-top:auto}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;position:relative}
.wd i{width:100%;max-width:22px;border-radius:6px;background:var(--surface-2)}
.wd.on i{background:var(--gold)}
.wd span{font-size:.68rem;color:var(--muted);font-weight:700}
.wd.today span{color:var(--ink)}
.wd.today i{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);outline-offset:1px}
.week.big{height:150px}
.week.big .wd i{max-width:34px}
.wd em{font-style:normal;font-size:.68rem;color:var(--muted)}
.t-puzzle{grid-column:5/span 2;grid-row:span 2}
.t-puzzle .board{max-width:none;border-radius:12px}
.t-rank{grid-column:span 2;flex-direction:row;align-items:center;gap:14px}
.rank-g{font-size:3rem;line-height:1;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.t-live{grid-column:span 2}
.t-live.is-live{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.t-stats{grid-column:span 4;flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:1.45rem;font-family:var(--f-display);font-weight:700}
.kpi b small{font-size:.75rem;color:var(--muted);font-family:var(--f-body)}
.kpi span{font-size:.75rem;color:var(--muted);font-weight:600}
@media (max-width:1000px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}.t-continue{grid-column:span 4;min-height:230px}.t-puzzle{grid-column:span 2;grid-row:span 2}.t-stats{grid-column:span 4}}
@media (max-width:640px){.bento{grid-template-columns:1fr 1fr;gap:12px}.tile{padding:16px}.t-continue,.t-puzzle,.t-goal,.t-stats,.t-rank,.t-live{grid-column:span 2}.t-continue{padding:20px}.tile-art{font-size:9rem}}

/* course cards row */
.cards-x{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease,box-shadow .2s ease}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.ccard .pill{align-self:flex-start}
.ccard b{font-family:var(--f-display);font-size:1rem}
.ccard-icon{position:absolute;right:12px;top:6px;font-size:3.2rem;opacity:.16;color:var(--accent)}
.ccard-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
@media (max-width:640px){.cards-x{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px}.ccard{scroll-snap-align:start}}

/* --- Learning path (courses) --- */
.path{display:flex;flex-direction:column;gap:18px;max-width:760px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.unit-h{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent-soft) 70%,var(--surface)),var(--surface));border-bottom:1px solid var(--line)}
.unit-done .unit-h{background:linear-gradient(120deg,var(--good-soft),var(--surface))}
.unit-end .unit-h{border-bottom:0;background:linear-gradient(120deg,var(--gold-soft),var(--surface))}
.unit-icon{width:52px;height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1.9rem;flex:none}
.unit-h .stack{flex:1}
.unit-prog{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center}
.unit-prog svg{position:absolute;inset:0}
.unit-prog span{font-size:.66rem;font-weight:700}
.unit-done .ring-fg{stroke:var(--good)}
.stops{list-style:none;margin:0;padding:22px 16px 26px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.stop{transform:translateX(calc(var(--x) * 56px));position:relative}
.stop button{display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--ink);text-align:left;padding:0}
.node{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:var(--surface-2);color:var(--muted);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .12s ease}
.stop button:hover .node{transform:translateY(-2px)}
.stop button:active .node{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stop.done .node{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.stop.cur .node{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000),0 0 0 8px var(--accent-soft)}
.stop-t{display:flex;flex-direction:column;gap:2px;width:220px}
.stop-t b{font-size:.98rem}
@media (max-width:640px){.stop{transform:translateX(calc(var(--x) * 22px))}.stop-t{width:170px}.unit-h{padding:16px}.unit-h .li-m{display:none}}

/* --- Progress page --- */
.bento-p .tile{grid-column:span 3}
.bento-p .t-rankbig{grid-column:span 6;padding:24px}
.ranks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--surface-2);color:var(--muted)}
.rk span{font-size:2rem;line-height:1;opacity:.5}
.rk small{font-size:.7rem;font-weight:700}
.rk.past{background:var(--gold-soft);color:var(--gold)}.rk.past span{opacity:.9}
.rk.now{background:var(--gold);color:#2A1D00;box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 40%,transparent)}.rk.now span{opacity:1}
@media (max-width:640px){.bento-p .tile{grid-column:span 2}.bento-p .t-rankbig{grid-column:span 2}.rk span{font-size:1.4rem}.rk small{font-size:.58rem}}

/* XP pop */
.xppop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;background:var(--gold);color:#2A1D00;font-weight:800;font-family:var(--f-display);padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.2);pointer-events:none;animation:xp 1.6s ease forwards}
@keyframes xp{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
@media (prefers-reduced-motion:reduce){.xppop{animation:none}.ccard:hover,.stop button:hover .node{transform:none}}

/* small refinements on existing screens */
.player{border-radius:var(--radius);box-shadow:var(--shadow)}
.board{border-radius:10px}
.pzlist button{border-radius:10px}
.opt{border-radius:12px;padding:14px 16px;font-weight:600}
.feedback{border-radius:12px}
.chip{font-weight:700}
.toast{border-radius:12px;box-shadow:var(--shadow-up)}
.login-card{border-radius:24px}

/* Practice */
.prsec-h{display:flex;align-items:center;gap:14px}
.prsec-i{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1.7rem;box-shadow:var(--shadow);flex:none}
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.prcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .2s ease}
.prcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-up)}
.prcard.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.prcard.done .ring-fg{stroke:var(--good)}
.prcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prcard-top b{font-family:var(--f-display);font-size:.98rem}
.prcard-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
a.back{text-decoration:none}
@media (max-width:720px){nav.tabs a{padding:6px 2px!important;font-size:.6rem!important}}

/* Practice v2: board thumbnails, lighter type */
.prsec{gap:16px}
.prsec-h h2{font-family:var(--f-body);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.prsec-i{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.prgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.prcard{flex-direction:row;align-items:stretch;gap:14px;padding:12px;border-radius:18px}
.prcard .board.mini{width:112px;min-width:112px;max-width:112px;height:112px;border-radius:10px;box-shadow:0 0 0 1px var(--line);pointer-events:none}
.board.mini .coord{display:none}
.prcard-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;padding:2px 2px 0 0}
.prcard-body b{font-family:var(--f-body);font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
.prcard-d{font-size:.84rem;line-height:1.4}
.prcard-foot{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:.75rem;color:var(--muted)}
.prcard-foot .bar{flex:1;height:6px}
.prcard.done .bar i{background:var(--good)}
.prcard.done .prcard-body b::after{content:" ✓";color:var(--good)}
.prcard:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
@media (max-width:640px){.prgrid{grid-template-columns:1fr}.prcard .board.mini{width:84px;min-width:84px;height:84px}}
/* lighter headings on cards everywhere */
.tile h3,.ccard b,.unit-h h2,.course h2,.card h2{font-family:var(--f-body);font-weight:800;letter-spacing:-.01em}

/* Classic wooden board (all boards) */
:root{--sq-light:#F0DDBA;--sq-dark:#B98A61;--sq-hi:#E8C547;--sq-sel:#7FB1D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sq-light:#E3CDA6;--sq-dark:#A97C55;--sq-hi:#E0BB3E;--sq-sel:#5B9BCB}}
:root[data-theme="dark"]{--sq-light:#E3CDA6;--sq-dark:#A97C55;--sq-hi:#E0BB3E;--sq-sel:#5B9BCB}
.sq .coord{color:var(--sq-dark)} .sq.d .coord{color:var(--sq-light)}
.board{box-shadow:0 0 0 1px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.12)}
.board.mini .pc{font-size:12.5cqw}
.board.mini .pc.b{text-shadow:none}

/* Practice v3: icon tiles */
.prsec,.drill{--c1:#9B5DE5;--c2:#7B3FC4}
[data-sec="checkmates"]{--c1:#E2565E;--c2:#B8323B}
[data-sec="fundamental-tactics"]{--c1:#F0A43A;--c2:#D2801A}
[data-sec="advanced-tactics"]{--c1:#9B6BEA;--c2:#7146C8}
[data-sec="pawn-endgames"]{--c1:#3DB980;--c2:#22915F}
[data-sec="rook-endgames"]{--c1:#4C8FE8;--c2:#2D6CC4}
.prsec-h h2{font-size:1.5rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.prsec-h{border-left:4px solid var(--c1);padding-left:14px}
.prcard{align-items:center;padding:14px;gap:16px}
.pricon{width:72px;height:72px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px color-mix(in srgb,var(--c2) 35%,transparent)}
.pricon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.prcard-body b{font-size:1.15rem;font-weight:700}
.prcard-tag{color:var(--muted);font-size:.92rem}
.prcard-foot .bar i{background:var(--c1)}
.prcard:hover{border-color:color-mix(in srgb,var(--c1) 50%,var(--line))}
.prcard:hover .pricon{transform:rotate(-4deg) scale(1.04)}
.pricon{transition:transform .18s ease}
@media (max-width:640px){.pricon{width:60px;height:60px;border-radius:14px}.pricon svg{width:32px;height:32px}.prsec-h h2{font-size:1.2rem}}

/* Practice board screen */
.drill{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;max-width:1100px}
.drill-board{display:flex;flex-direction:column;gap:12px;align-items:center;position:sticky;top:20px}
.drill-board .board{max-width:min(calc(100vh - 80px),720px);width:100%;border-radius:12px}
.drill-side{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.ds-head{display:flex;align-items:center;gap:12px}
.ds-back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;text-decoration:none;color:var(--ink);background:var(--surface-2);font-weight:700;flex:none}
.ds-back:hover{background:var(--accent-soft);color:var(--accent)}
.pricon.sm{width:44px;height:44px;border-radius:12px}.pricon.sm svg{width:24px;height:24px}
.ds-ht{min-width:0}.ds-ht h1{font-family:var(--f-body);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;line-height:1.15}
.ds-about{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:.88rem}
.ds-about summary{cursor:pointer;font-weight:700;color:var(--muted)}
.ds-about p{margin-top:8px;color:var(--ink);line-height:1.5}
.ds-prog{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.ds-prog .bar i{background:var(--c1)}
.ds-goal{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--c1) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c1) 40%,transparent)}
.ds-goal-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));font-weight:800;font-size:1.2rem}
.ds-goal-i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ds-goal b{display:block;font-size:1.02rem;line-height:1.3}
.ds-goal span{font-size:.84rem;color:var(--muted)}
.ds-goal span b{display:inline;font-size:inherit;color:var(--ink)}
.ds-goal.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.ds-goal.ok .ds-goal-i{background:var(--good);color:#fff;font-size:1.3rem}
.ds-status{font-weight:600;padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;gap:8px;align-items:center;min-height:44px}
.ds-status.ok{background:var(--good-soft);color:var(--good)}
.ds-status.no{background:var(--accent-soft);color:var(--accent)}
.ds-moves{max-height:132px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.ds-moves ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-family:var(--f-mono);font-size:.86rem}
.ds-moves li{display:grid;grid-template-columns:2.4em 1fr 1fr;gap:6px}
.ds-moves .mn{color:var(--muted)}
.ds-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.8rem}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover:not(:disabled){border-color:var(--c1);color:var(--c1)}
.tbtn:disabled{opacity:.4;cursor:default}
.ds-next{width:100%}
.ds-next.pulse{animation:nextp 1.4s ease-in-out infinite}
@keyframes nextp{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.ds-next.pulse{animation:none}}
.ds-dots{display:flex;flex-wrap:wrap;gap:6px}
.ds-dots button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.ds-dots button.cur{border:2px solid var(--c1);color:var(--ink)}
.ds-dots button.solved{background:var(--good-soft);color:var(--good);border-color:transparent}
.ds-dots button.solved.cur{border:2px solid var(--good)}
@media (max-width:900px){
  .drill{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .drill-side{display:contents}
  .ds-head{order:1}.ds-about{order:2}.ds-goal{order:3}.drill-board{order:4;position:static;width:100%}.ds-status{order:5}.ds-tools{order:6}.ds-next{order:7}.ds-prog{order:8}.ds-dots{order:9}.ds-moves{order:10}
  .drill-board .board{max-width:100%}
  .ds-moves{max-height:90px}
}

/* Board coordinates: bigger, bold, high contrast */
.coord{font-size:max(11px,2.6cqw);font-weight:800;opacity:1;font-family:var(--f-body)}
.coord.f{right:4px;bottom:2px} .coord.r{left:4px;top:2px}
.sq .coord{color:#5A3A1E} .sq.d .coord{color:#FFF6E6}
.board.mini .coord{display:none}
.ds-tools{grid-template-columns:repeat(4,1fr)}
#pzFull svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
/* Present mode: the board fills the screen */
body.present{padding-left:0!important;background:var(--bg)}
body.present .topbar,body.present nav.tabs{display:none!important}
body.present main{max-width:none;padding:12px 16px!important;min-height:100vh}
body.present .drill{max-width:none;grid-template-columns:calc(100vh - 24px) minmax(300px,1fr);gap:20px;align-items:start}
body.present .drill-board{position:static}
body.present .drill-board .board{max-width:calc(100vh - 24px);width:calc(100vh - 24px);border-radius:8px}
body.present .ds-about,body.present .ds-dots{display:none}
body.present .ds-goal b{font-size:1.35rem}
body.present .pz{grid-template-columns:calc(100vh - 24px) minmax(280px,1fr)}
body.present .pz .board{max-width:calc(100vh - 24px);width:calc(100vh - 24px)}
body.present .pz{max-width:none}
body.present section.view:has(> .chips){display:none}
@media (max-aspect-ratio:4/3){body.present .drill,body.present .pz{grid-template-columns:1fr}body.present .drill-board .board,body.present .pz .board{width:min(100vw - 32px,100vh - 260px);max-width:none}}

.pc.w{color:#FFFFFF;text-shadow:0 0 1px #2A1A0C,0 0 1px #2A1A0C,0 0 2px #2A1A0C,0 1px 2px rgba(0,0,0,.55)}

/* Puzzle levels */
[data-sec="puzzles"]{--c1:#5BB548;--c2:#3C8E2E}
.lvhero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(130deg,color-mix(in srgb,var(--c1) 18%,var(--surface)),var(--surface))}
.lvhero-l{display:flex;align-items:center;gap:16px}
.lvhero h1{font-family:var(--f-body);font-weight:800}
.lvhero .btn{background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c2) 70%,#000),0 8px 20px color-mix(in srgb,var(--c2) 35%,transparent)}
.lvstage{gap:14px}
.lvstage-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--c1,#5BB548);padding-left:12px}
.lvstage-h h2{font-size:1.4rem;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.lvpath{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 12px;box-shadow:var(--shadow)}
.lvrow{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.lvrow.rev{direction:rtl}
.lvrow::before{content:"";position:absolute;left:10%;right:10%;top:34px;height:6px;border-radius:6px;background:var(--surface-2);z-index:0}
.lvnode{direction:ltr;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:4px;color:var(--ink)}
.lvn{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:1.25rem;background:var(--surface-2);color:var(--muted);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .12s ease}
.lvnode.done .lvn{background:linear-gradient(145deg,var(--c1,#5BB548),var(--c2,#3C8E2E));color:#fff;border-color:transparent;box-shadow:0 5px 0 color-mix(in srgb,#3C8E2E 70%,#000)}
.lvnode.cur .lvn{background:linear-gradient(145deg,#F7B23B,#E08A12);color:#2A1700;border-color:transparent;box-shadow:0 5px 0 #A86200,0 0 0 8px rgba(247,178,59,.18);animation:lvp 1.6s ease-in-out infinite}
@keyframes lvp{50%{box-shadow:0 5px 0 #A86200,0 0 0 13px rgba(247,178,59,.10)}}
@media (prefers-reduced-motion:reduce){.lvnode.cur .lvn{animation:none}}
.lvnode.lock{cursor:default;opacity:.6}
.lvnode.lock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.lvnode .lvn{transform:none;border-radius:50%}
.lvnode:not(.lock):hover .lvn{transform:translateY(-3px)}
.lvtag{font-size:.75rem;font-weight:700;color:var(--ink)}
.lvtag.dim{color:var(--muted);font-weight:600;font-family:var(--f-mono)}
.stars{display:inline-flex;gap:1px;font-size:.9rem;line-height:1}
.stars i{font-style:normal;color:var(--surface-2);text-shadow:0 0 1px rgba(0,0,0,.4)}
.stars i.on{color:#F5B83A}
.lvdots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.lvdots span{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.72rem;font-weight:700;font-family:var(--f-mono);background:var(--surface-2);color:var(--muted);border:1px solid transparent}
.lvdots span.cur{border:2px solid var(--c1);color:var(--ink)}
.lvdots span.ok{background:var(--good);color:#fff}
.lvdots span.retry{background:#E7A33A;color:#2A1700}
.tm{width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:block}
.tm.w{background:#fff}.tm.b{background:#111}
.ds-status .stars{font-size:1.1rem;margin-left:6px}
@media (max-width:640px){.lvn{width:50px;height:50px;font-size:1rem}.lvrow::before{top:27px}.lvpath{padding:14px 4px}.lvhero{padding:16px}.lvhero .btn{width:100%}}

/* Puzzle map (full-screen worlds) */
body[data-route="puzzles"] main{max-width:none!important;padding:0!important;gap:0}
.pmap{position:relative;padding-bottom:110px}
.world{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky2),var(--sky1))}
.world::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.12))}
.world+.world{border-top:0}
.world-sign{position:sticky;top:14px;margin:14px auto 0;width:max-content;max-width:90%;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 22px;border-radius:16px;background:linear-gradient(180deg,#8A5A2E,#6B4222);color:#FFF1D6;box-shadow:0 4px 0 #4A2C14,0 10px 24px rgba(0,0,0,.3);border:2px solid #B07A44}
.world-sign b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.02em}
.world-sign span{font-size:.75rem;opacity:.9;font-family:var(--f-mono)}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.deco{position:absolute;transform:translate(-50%,-100%);z-index:2;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.deco svg{width:100%;height:auto;display:block}
.deco.cloud{z-index:1;filter:none;transform:translate(-50%,-50%)}
.deco.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.4}}
.mtile{position:absolute;transform:translate(-50%,-50%);z-index:4;width:78px;height:72px;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer}
.mt-top{width:78px;height:68px;display:grid;place-items:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(180deg,#D9A66A,#B57B42);color:#FFF6E4;font-weight:800;font-size:1.35rem;font-family:var(--f-display);text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.mtile::before{content:"";position:absolute;width:78px;height:68px;top:9px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:rgba(0,0,0,.28);z-index:-1}
.mtile.done .mt-top{background:linear-gradient(180deg,#7DD36A,#43A23A)}
.mtile.cur .mt-top{background:linear-gradient(180deg,#FFD36B,#F2A324);color:#4A2A00;text-shadow:none}
.mtile.lock .mt-top{background:linear-gradient(180deg,#B9A88F,#8F7D63);color:rgba(255,255,255,.65)}
.mtile.lock{cursor:default}
.mtile:not(.lock):hover .mt-top{transform:translateY(-3px)}
.mt-top{transition:transform .12s ease}
.mt-stars{position:absolute;bottom:-14px;font-size:.8rem;color:#FFD54A;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.mpawn{position:absolute;top:-30px;left:-34px;z-index:7;font-size:46px;line-height:1;color:#fff;text-shadow:0 0 2px #333,0 3px 0 #555,0 8px 10px rgba(0,0,0,.35);animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.mpawn,.deco.twinkle{animation:none}}
.pmap-credit{text-align:center;font-size:.75rem;color:var(--muted);padding:12px}
.pbar{position:fixed;left:var(--side,0);right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px max(16px,4vw) calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,18,24,.0),rgba(14,18,24,.85) 30%);backdrop-filter:blur(2px)}
.pbar-l{display:flex;flex-direction:column;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pbar-l .li-m{color:#E6EAF0}
.pbar-lv{font-family:var(--f-display);font-size:1.3rem}
.pbar-go{white-space:nowrap;border:0;border-radius:16px;padding:16px 34px;font-weight:800;font-size:1.15rem;color:#fff;background:linear-gradient(180deg,#7DCB5A,#4E9F35);box-shadow:0 5px 0 #33711F,0 10px 22px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pbar-go:active{transform:translateY(3px);box-shadow:0 2px 0 #33711F}
@media (max-width:1099px){.pbar{left:0}}
@media (max-width:720px){.pbar{bottom:calc(58px + env(safe-area-inset-bottom));padding:10px 14px}.pbar-go{padding:13px 22px;font-size:1rem}.mtile,.mt-top,.mtile::before{width:66px}.mt-top,.mtile::before{height:58px}.mt-top{font-size:1.15rem}}

/* Artwork backgrounds */
.world{background-size:cover;background-position:center top;background-repeat:no-repeat}
.world::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 90px,transparent calc(100% - 90px),rgba(0,0,0,.22))}
.world::after{display:none}
.trail{filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.mtile{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.mtile.cur{z-index:6}
.mt-stars{background:rgba(0,0,0,.45);padding:1px 6px;border-radius:99px}

.pc{width:100%;height:100%;display:block;background-repeat:no-repeat;background-position:center;background-size:90%;font-size:0!important;color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.pc.inline{display:inline-block;width:26px;height:26px;vertical-align:-8px;background-size:contain;filter:none}
/* Phones: board pages fit on one screen (board, status and Next without scrolling) */
@media (max-width:600px){
  main:has(> .drill){padding-top:10px!important;gap:10px}
  .drill{gap:8px!important}
  .drill .ds-head{gap:10px}
  .drill .ds-head .pricon{display:none}
  .drill .ds-ht .eyebrow{font-size:.66rem}
  .drill .ds-ht h1{font-size:1.12rem}
  .drill .ds-about{padding:7px 10px;font-size:.82rem}
  .drill .ds-goal{padding:8px 10px;gap:10px;border-radius:12px}
  .drill .ds-goal-i{width:28px;height:28px;border-radius:8px;font-size:.95rem}
  .drill .ds-goal-i svg{width:16px;height:16px}
  .drill .ds-goal b{font-size:.92rem}
  .drill .ds-goal span{font-size:.76rem}
  .drill[data-sec="puzzles"] .ds-goal span{display:none}
  .drill .lvdots{gap:4px}.drill .lvdots span{border-radius:6px;font-size:.66rem}
  .drill-board{gap:8px}
  .drill-board .board{width:min(100%,calc(100svh - 372px));min-width:220px;margin-inline:auto}
  .drill:has(.ds-about) .drill-board .board{width:min(100%,calc(100svh - 400px))}
  .drill .ds-status{order:5;min-height:38px;padding:7px 10px;font-size:.9rem}
  .drill .ds-next{order:6;min-height:48px;padding-block:10px}
  .drill .ds-tools{order:7;gap:6px}
  .drill .tbtn{padding:7px 2px;font-size:.68rem;white-space:nowrap;gap:2px}
  .drill .tbtn svg{width:18px;height:18px}
  .coord{font-size:max(9px,2.2cqw)}
}
</style>

ve":"exd6","say":"White captures en passant, as if the black pawn had moved only one square. This is only allowed immediately."},{"fen":"8/4P1k1/8/8/8/8/6K1/8 w - - 0 1","say":"Last, promotion. A pawn that reaches the final rank becomes a new piece."},{"move":"e8=Q","say":"White chooses a queen, which is almost always the best choice."}]}]},{"id":"tac","title":"Winning Tricks","level":"Intermediate","blurb":"Simple tricks to win your opponent's pieces: forks, pins and back-rank traps.","lessons":[{"id":"t1","title":"Knight Fork: Attack Two Pieces at Once","minutes":9,"videoUrl":null,"key":"Look for a square where your knight attacks the king and another piece at the same time.","steps":[{"fen":"2q3k1/5ppp/8/3N4/8/8/5PPP/6K1 w - - 0 1","say":"A fork is one piece attacking two targets at once. Look at the black king and queen."},{"move":"Ne7+","say":"The knight gives check and attacks the queen at the same time."},{"move":"Kf8","say":"Black must deal with the check first."},{"move":"Nxc8","say":"White collects the queen. That is a gain of nine points of material."}]},{"id":"t2","title":"Pins: Freeze a Piece in Place","minutes":8,"videoUrl":null,"key":"A pinned piece can't run away, so attack it with a pawn.","steps":[{"fen":"4k3/7p/2n5/1B6/8/8/3P4/4K3 w - - 0 1","say":"The bishop on b5, the knight on c6 and the king on e8 sit on one diagonal."},{"say":"The knight is pinned. Moving it would expose the king, so it is not allowed."},{"move":"d4","say":"White brings a pawn forward to attack the pinned piece."},{"move":"h6","say":"Black has nothing useful to do."},{"move":"d5","say":"The pawn attacks the knight, and the knight cannot step away."},{"move":"h5","say":"Black waits again."},{"move":"dxc6","say":"White wins the knight with a pawn."}]},{"id":"t3","title":"Back-Rank Mate: Trap the King at Home","minutes":7,"videoUrl":null,"key":"Push one pawn in front of your castled king (like h3) so your king has an escape square.","steps":[{"fen":"6k1/5ppp/8/8/8/8/5PPP/3R2K1 w /* Stockfish runs in the browser (Web Worker). One request at a time. */
const SF={w:null,ready:null,busy:Promise.resolve()};
function sfStart(){if(SF.ready)return SF.ready;
  SF.ready=new Promise((res,rej)=>{try{SF.w=new Worker("/stockfish/stockfish-18-lite-single.js")}catch(e){return rej(e)}
    const t=setTimeout(()=>rej(new Error("engine timeout")),30000);
    SF.w.onmessage=e=>{if(String(e.data).startsWith("uciok")){clearTimeout(t);SF.w.postMessage("setoption name Hash value 16");res()}};
    SF.w.onerror=e=>{clearTimeout(t);rej(e)};SF.w.postMessage("uci")});
  return SF.ready}
function sfAsk(fen,{depth=12,movetime}={}){
  const run=()=>new Promise(async(res,rej)=>{try{await sfStart()}catch(e){return rej(e)}
    let last=null;SF.w.onmessage=e=>{const l=String(e.data);
      if(l.startsWith("info")&&l.includes(" score ")&&l.includes(" pv "))last=l;
      if(l.startsWith("bestmove")){const m=last&&last.match(/score (cp|mate) (-?\d+)/);const stm=fen.split(" ")[1]==="w"?1:-1;
        const raw=m?(m[1]==="mate"?(+m[2]>0?100000-+m[2]:-100000-+m[2]):+m[2]):0;
        res({best:l.split(" ")[1],white:raw*stm,mate:m&&m[1]==="mate"?+m[2]*stm:null})}};
    SF.w.postMessage("position fen "+fen);SF.w.postMessage(movetime?"go movetime "+movetime:"go depth "+depth)});
  const p=SF.busy.then(run,run);SF.busy=p.catch(()=>{});return p}

function goalText(c,color){const g=c.goal,side=color==="w"?"White":"Black";
  if(!g)return c.line.length?"Play the right moves. The computer answers.":"Checkmate the computer.";
  if(g.type==="mate")return g.n>=99?"Checkmate the computer.":`Checkmate in ${g.n} move${g.n>1?"s":""}.`;
  if(g.type==="eval"&&(color==="w"?g.cp<0:g.cp>0))return `Defend well: don't let your opponent get far ahead in the next ${g.n} moves.`;
  if(g.type==="eval"){const amt=Math.abs(g.cp);const what=amt>=900?"a big advantage (like winning the queen)":amt>=450?"a piece or more":amt>=250?"a clear advantage (about a piece)":amt>=90?"an advantage (about a pawn)":"a small edge";return `Win ${what} in ${g.n} move${g.n>1?"s":""}.`}
  if(g.type==="promote")return "Promote a pawn and keep the win.";
  if(g.type==="draw")return `Hold the draw for ${g.n} moves.`;
  if(g.type==="equalize")return `Defend and stay level for ${g.n} moves.`;
  return "Find the best plan."}

function prSolved(){const t=PR.topics.find(x=>x.id===PRS.tid),k=prKey(t,PRS.i);PRS.state="ok";setTimeout(()=>sfx("solved"),200);
  S.practice=S.practice||{};if(!S.practice[k]){S.practice[k]=true;PRS.fresh=true;save();award(10)}render()}
function prFail(msg){PRS.state="fail";PRS.msg=msg;sfx("wrong");render()}
function prPlay(m){const mv=PRS.g.move(m);if(!mv)return null;moveSound(mv,PRS.g);PRS.anim=[mv.from,mv.to];PRS.last=[mv.from,mv.to];return mv}
function prAuto(){const t=PR.topics.find(x=>x.id===PRS.tid),c=t.chapters[PRS.i];const u=c.line[PRS.ply];if(!u)return;
  PRS.state="think";PRS.msg="";setTimeout(()=>{if(!PRS||PRS.tid!==t.id)return;prPlay({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});PRS.ply++;
    PRS.state=PRS.ply>=c.line.length?"ok":"idle";if(PRS.state==="ok")return prSolved();render()},550)}
const prEnd=g=>g.in_checkmate()||g.in_draw()||g.in_stalemate()||g.insufficient_material()||g.in_threefold_repetition();
async function prAfterUser(mv){
  const t=PR.topics.find(x=>x.id===PRS.tid),c=t.chapters[PRS.i],g=PRS.g,goal=c.goal,me=PRS.color,tok=PRS;
  // Guided line: must match the next move of the line.
  if(!goal&&c.line.length){const want=c.line[PRS.ply];
    if(want&&mv.from+mv.to===want.slice(0,4)&&(!want[4]||mv.promotion===want[4])){PRS.ply++;if(PRS.ply>=c.line.length)return prSolved();PRS.state="idle";render();return prAuto()}
    g.undo();PRS.hist.pop();PRS.moves--;PRS.state="no";PRS.bad=[mv.from,mv.to];PRS.last=[];sfx("wrong");return render()}
  const type=goal?goal.type:"mate";
  if(g.in_checkmate())return prSolved();   // you delivered mate: always a win
  if(prEnd(g))return (type==="draw"||type==="equalize")?prSolved():prFail("That's a draw. You needed to win. Try again!");
  const meets=w=>me==="w"?w>=goal.cp:w<=goal.cp;
  PRS.state="think";PRS.msg="Checking your move…";render();
  try{
    if(type==="eval"&&PRS.moves>=goal.n){const r=await sfAsk(g.fen(),{depth:13});if(PRS!==tok)return;return meets(r.white)?prSolved():prFail("Good try, but that didn't win enough. Try again!")}
    if(type==="promote"&&mv.promotion){const r=await sfAsk(g.fen(),{depth:13});if(PRS!==tok)return;return meets(r.white)?prSolved():prFail("You promoted, but the position isn't winning. Try again!")}
    if(type==="mate"&&goal&&goal.n<99&&PRS.moves>=goal.n)return prFail(`Not checkmate in ${goal.n}. Try again!`);
    if((type==="draw"||type==="equalize")&&PRS.moves>=goal.n){const r=await sfAsk(g.fen(),{depth:12});if(PRS!==tok)return;const mine=me==="w"?r.white:-r.white;return mine>-150?prSolved():prFail("You held on for a while, but the position slipped. Try again!")}
    // The computer answers with its best move.
    PRS.msg="The computer is thinking…";render();
    const r=await sfAsk(g.fen(),{depth:type==="mate"?14:12,movetime:type==="mate"?undefined:700});if(PRS!==tok)return;
    if(!r.best||r.best==="(none)")return prFail("No moves left. Try again!");
    prPlay({from:r.best.slice(0,2),to:r.best.slice(2,4),promotion:r.best[4]});
    if(g.in_checkmate())return prFail("You got checkmated. Try again!");
    if(prEnd(g))return (type==="draw"||type==="equalize")?prSolved():prFail("That's a draw. You needed to win. Try again!");
    if(type==="mate"&&goal&&goal.n<99){const left=goal.n-PRS.moves;if(left>0){const e=await sfAsk(g.fen(),{depth:Math.min(20,left*2+8)});if(PRS!==tok)return;
      const mateFor=me==="w"?e.mate:(e.mate==null?null:-e.mate);if(!(mateFor>0&&mateFor<=left))return prFail(`That lets the king escape. Checkmate in ${goal.n} isn't possible any more. Try again!`)}}
    PRS.state="idle";PRS.msg="";render();
  }catch(e){PRS.state="fail";PRS.msg="The chess engine couldn't start on this device. Try reloading the page.";render()}
}

  const t=PR.topics.find(x=>x.id===PRS.tid),c=t.chapters[PRS.i],g=PRS.g,flip=PRS.color==="b";
  const live=(PRS.state==="idle"||PRS.state==="no")&&!PRS.promo&&g.turn()===PRS.color;
  const dots=PRS.sel?g.moves({square:PRS.sel,verbose:true}).map(m=>m.to):[];

  drawBoard($("#prBoard"),g.fen(),{flip,anim,sel:PRS.sel,dots,bad:PRS.bad,hi:PRS.hint?[PRS.hint.slice(0,2),PRS.hint.slice(2,4)]:PRS.last,
    onSquare:live?sq=>{const pc=g.get(sq);
      if(pc&&pc.color===g.turn()){PRS.sel=PRS.sel===sq?null:sq;PRS.bad=[];if(PRS.state==="no")PRS.state="idle";return render()}
      if(!PRS.sel)return;ac();
      const cand=g.moves({square:PRS.sel,verbose:true}).filter(m=>m.to===sq);if(!cand.length){PRS.sel=null;return render()}
      if(cand.some(m=>m.promotion)){PRS.promo={from:PRS.sel,to:sq};PRS.sel=null;return render()}
      prMove({from:PRS.sel,to:sq})}:null});
  function prMove(m){PRS.hist.push(g.fen());const mv=prPlay(m);PRS.sel=null;PRS.bad=[];PRS.hint=null;if(!mv){PRS.hist.pop();return render()}PRS.moves++;prAfterUser(mv)}
  document.querySelectorAll("[data-promo]").forEach(b=>b.onclick=()=>{const p=PRS.promo;PRS.promo=null;prMove({...p,promotion:b.dataset.promo})});
  $("#prHint").onclick=async()=>{
    if(!c.goal&&c.line.length){PRS.hint=c.line[PRS.ply];return render()}
    PRS.state="think";PRS.msg="Looking for a hint…";render();const tok=PRS;
    try{const r=await sfAsk(g.fen(),{depth:14});if(PRS!==tok)return;PRS.hint=r.best;PRS.state="idle";PRS.msg="";render()}catch(e){PRS.state="idle";render()}};
  $("#prUndo").onclick=()=>{const f=PRS.hist.pop();if(!f)return;PRS.g=new Chess(f);PRS.moves=Math.max(0,PRS.moves-1);
    if(!c.goal&&c.line.length){const back=PRS.g.history().length;/* guided: recompute ply from line */let ply=0;const g2=new Chess(c.fen);while(ply<c.line.length&&g2.fen()!==PRS.g.fen()){const u=c.line[ply];g2.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});ply++}PRS.ply=ply}
    PRS.state="idle";PRS.msg="";PRS.last=[];PRS.hint=null;PRS.bad=[];render()};
  $("#prReset").onclick=()=>{prOpen(t,PRS.i);render()};

  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{prOpen(t,+b.dataset.ch);render()});
  sfStart().catch(()=>{});
}

function stopLesson(){if(!LP)return;clearTimeout(LP.timer);clearInterval(LP.clockTimer);LP.token++;LP.playing=false;if(LP.audio){LP.audio.pause();LP.audio.src=""}hush()}

function afterLessonTTS(){

      if(pc&&pc.color===g.turn()){PZ.sel=PZ.sel===sq?null:sq;PZ.bad=[];if(PZ.state==="no")PZ.state="idle";render();return}
      if(!PZ.sel)return;
      ac();const m=g.move({from:PZ.sel,to:sq,promotion:"q"});PZ.sel=null;
      if(!m){render();return}
      const want=p.line[PZ.ply], isLast=PZ.ply===p.line.length-1;
      const ok=(m.from+m.to)===want.slice(0,4)||(isLast&&p.mate&&g.in_checkmate());
      if(!ok){g.undo();sfx("wrong");PZ.state="no";PZ.bad=[m.from,m.to];PZ.last=[];render();return}
      moveSound(m,g);PZ.anim=[m.from,m.to];
      PZ.bad=[];PZ.last=[m.from,m.to];PZ.ply++;
      if(PZ.ply>=p.line.length){PZ.state="ok";setTimeout(()=>sfx("solved"),g.in_checkmate()?450:120);if(!S.puzzles[p.id]){S.puzzles[p.id]=true;save();award(p.pts)}render();return}
      PZ.state="wait";render();
      setTimeout(()=>{const r=p.line[PZ.ply];const rm=g.move({from:r.slice(0,2),to:r.slice(2,4),promotion:"q"});moveSound(rm,g);PZ.anim=rm?[rm.from,rm.to]:null;PZ.last=rm?[rm.from,rm.to]:[];PZ.ply++;PZ.state="idle";render()},650);
    }:null});
  $("#hintBtn").onclick=()=>{PZ.hint=true;render()};
  $("#resetBtn").onclick=()=>{pzLoad(p.id);render()};
  $("#pzFull").onclick=togglePresent;
  $("#showBtn").onclick=()=>{ac();pzLoad(p.id);const g2=PZ.g;let i=0;PZ.state="wait";render();
    const step=()=>{if(i>=p.line.length){PZ.state="idle";PZ.ply=0;PZ.g=new Chess(p.fen);PZ.last=[];toast("Your turn: now play it yourself");render();return}
      const u=p.line[i++];const m=g2.move({from:u.slice(0,2),to:u.slice(2,4),promotion:"q"});moveSound(m,g2);PZ.anim=m?[m.from,m.to]:null;PZ.last=m?[m.from,m.to]:[];render();setTimeout(step,900)};
    setTimeout(step,400)};
  $("#nextBtn").onclick=()=>{const list=PUZZLES.filter(x=>pzLevel==="All"||x.level===pzLevel);const i=list.findIndex(x=>x.id===p.id);pzLoad((list[(i+1)%list.length]||PUZZLES[0]).id);render()};
  document.querySelectorAll("[data-pz]").forEach(b=>b.onclick=()=>{pzLoad(b.dataset.pz);render()});
  document.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{pzLevel=b.dataset.lvl;const list=PUZZLES.filter(x=>pzLevel==="All"||x.level===pzLevel);if(!list.some(x=>x.id===PZ.id))pzLoad((list.find(x=>!S.puzzles[x.id])||list[0]).id);render()});
}

/* ---------- Tests ----------
   Each test: 3 knowledge questions + 7 "find the best move" positions.
   Difficulty follows the puzzle level the student has reached (more puzzles solved → harder test). */
const TEST_N=10;
const testTotal=t=>t.total||12;
function testTier(){const L=lvState().unlocked;return L<=5?0:L<=20?1:L<=45?2:3}
function lvSolvedCount(){const st=lvState();return Object.keys(st.done).length*10+Object.values(st.part||{}).reduce((a,r)=>a+r.filter(x=>x==="ok").length,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function testPuzzleQ(p){const g=new Chess(p[1]),mv=p[2].split(" ");
  const op=g.move({from:mv[0].slice(0,2),to:mv[0].slice(2,4),promotion:mv[0][4]});if(!op)return null;
  const u=mv[1],legal=g.moves({verbose:true});
  const right=legal.find(m=>m.from===u.slice(0,2)&&m.to===u.slice(2,4)&&(!u[4]||m.promotion===u[4]));if(!right)return null;
  const mates=m=>{g.move(m.san);const x=g.in_checkmate();g.undo();return x};
  const others=legal.filter(m=>m.san!==right.san&&!mates(m));
  const forcing=shuffle(others.filter(m=>m.captured||m.san.includes("+"))),samePc=shuffle(others.filter(m=>m.piece===right.piece&&!forcing.includes(m)));
  const pick=[];for(const m of [...forcing,...samePc,...shuffle(others)])if(pick.length<3&&!pick.includes(m.san))pick.push(m.san);
  if(pick.length<3)return null;
  const o=shuffle([right.san,...pick]);
  return {kind:"pz",fen:g.fen(),last:[op.from,op.to],color:g.turn(),o,a:o.indexOf(right.san),rating:p[3]}}
function buildTest(){const tier=testTier(),L=lvState().unlocked,max=LVD.length;
  const kq=shuffle(QBANK[tier]).slice(0,3).map(q=>{const o=shuffle(q.o);return {kind:"q",q:q.q,o,a:o.indexOf(q.o[q.a])}});
  const start=Math.max(1,Math.min(L,max-6)),pq=[];
  for(let l=start;l<=max&&pq.length<TEST_N-3;l++){for(const p of shuffle(LVD[l-1])){const q=testPuzzleQ(p);if(q){pq.push(q);break}}}
  return {tier,level:L,qs:[...kq,...pq]}}
let TT=null,tq=0,tAns=[],tDone=false;
function vTests(){
  if(!LVD)return `<section class="stack view"><p class="li-m">Loading test…</p></section>`;
  if(!TT){TT=buildTest();tq=0;tAns=[];tDone=false}
  const Q=TT.qs,n=Q.length,tierName=TIERS[TT.tier];
  if(tDone){const sc=tAns.filter((a,i)=>a===Q[i].a).length;
    return `<section class="card stack view" style="max-width:680px">
      <div class="eyebrow">${tierName} test · result</div><div class="score">${sc}/${n}</div>
      <p>${sc===n?"Perfect! Solve more puzzle levels to unlock a harder test.":sc>=7?"Good job! Check the ones you missed below.":"Keep solving puzzle levels, then try again."}</p>
      <div style="overflow-x:auto"><table><thead><tr><th>Question</th><th>Your answer</th></tr></thead><tbody>
      ${Q.map((q,i)=>`<tr><td>${q.kind==="pz"?`Best move · rating ${q.rating}`:esc(q.q)}</td><td style="color:${tAns[i]===q.a?"var(--good)":"var(--accent)"}">${esc(q.o[tAns[i]])}${tAns[i]!==q.a?`<br><span class="li-m">Answer: ${esc(q.o[q.a])}</span>`:""}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row"><button class="btn" id="retry">New test</button><a class="btn ghost" href="#puzzles" style="text-decoration:none">Puzzles</a></div></section>`}
  const q=Q[tq],ans=tAns[tq];
  return `<section class="stack view" style="max-width:640px"><div class="eyebrow">${tierName} test</div><h1>Question ${tq+1} of ${n}</h1>
    <div class="bar"><i style="width:${tq/n*100}%"></i></div></section>
  <section class="card q view" style="max-width:640px">
    ${q.kind==="pz"?`<h2 style="font-family:var(--f-body);font-size:1.15rem">${q.color==="w"?"White":"Black"} to move. Find the best move.</h2><div class="board" id="tBoard" style="max-width:360px;margin:4px auto 8px"></div>`
      :`<h2 style="font-family:var(--f-body);font-size:1.15rem">${esc(q.q)}</h2>`}
    ${q.o.map((o,i)=>`<button class="opt ${ans!=null?(i===q.a?"right":i===ans?"wrong":""):""}" data-opt="${i}" ${ans!=null?"disabled":""}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="tnext" ${ans==null?"disabled":""}>${tq===n-1?"See result":"Next question"}</button></div>
  </section>`;
}
function afterTests(){
  if(!LVD){lvLoad().then(()=>{if(route()==="tests")render()}).catch(()=>{});return}
  if(tDone){$("#retry").onclick=()=>{TT=null;render();window.scrollTo(0,0)};return}
  const Q=TT.qs,q=Q[tq];
  if(q.kind==="pz")drawBoard($("#tBoard"),q.fen,{flip:q.color==="b",hi:q.last});
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{tAns[tq]=+b.dataset.opt;sfx(tAns[tq]===q.a?"right":"wrong");render()});
  $("#tnext").onclick=()=>{if(tq<Q.length-1){tq++}else{tDone=true;const sc=tAns.filter((a,i)=>a===Q[i].a).length;S.tests.push({score:sc,total:Q.length,tier:TT.tier,level:TT.level,at:new Date().toISOString()});save();award(sc*5)}render();window.scrollTo(0,0)};
}

async function liveApi(path,opts={}){
  let r;
  try{r=await fetch("/api"+path,{method:opts.method||"GET",headers:Object.assign({"Content-Type":"application/json"},S.liveToken?{Authorization:"Bearer "+S.liveToken}:{}),body:opts.body?JSON.stringify(opts.body):undefined})}
  catch(e){throw Object.assign(new Error("offline"),{code:"offline"})}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j){
    const err=Object.assign(new Error((j&&j.error)||"Something went wrong. Please try again."),{code:(j&&j.code)||(r.status===404?"offline":""),status:r.status});
    if(err.code==="signin"&&AUTH.state==="in"){S.liveToken="";save();AUTH={state:"out",user:null,msg:err.message};resetLive();setTimeout(render,0)}
    throw err;
  }
  return j;
}

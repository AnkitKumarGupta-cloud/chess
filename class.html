<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live class · Chess Sathi</title>
<style>
  html,body,#root{height:100%;margin:0}
  body{background:#0F151C;color:#E7ECF2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wait{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .wait h1{font-size:1.3rem;margin:0}
  .wait p{color:#94A3B4;margin:0;max-width:44ch;line-height:1.5}
  .wait a,.wait button{background:#E5525B;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
  .note{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;background:#18212B;border:1px solid #2A3542;color:#E7ECF2;padding:8px 14px;border-radius:99px;font-size:.85rem;font-weight:600}
  .note.bad{border-color:#E5525B}
  .extras{position:fixed;left:12px;top:12px;z-index:50;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  .xbtn{background:#18212B;color:#E7ECF2;border:1px solid #2A3542;border-radius:99px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
  .xbtn.on{border-color:#E5525B;color:#fff;background:#3A1E22}
  .bgpanel{position:absolute;top:44px;left:0;background:#18212B;border:1px solid #2A3542;border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(3,92px);gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .bgopt{background:none;border:2px solid transparent;border-radius:10px;color:#E7ECF2;font:inherit;font-size:.75rem;font-weight:600;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}
  .bgopt.on{border-color:#E5525B}
  .bgthumb{width:100%;aspect-ratio:16/10;border-radius:6px;background:#2A3542 center/cover;display:grid;place-items:center;color:#94A3B4}
  .hands{position:fixed;right:12px;top:12px;z-index:50;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .hand{background:#E5525B;color:#fff;border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:700}
  .handhint{color:#94A3B4;font-size:.72rem}
  @media (max-width:640px){.extras{top:auto;bottom:76px}.bgpanel{top:auto;bottom:44px;grid-template-columns:repeat(3,80px)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/class.jsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1016">
<title>Live class · Chess Sathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#0B1016; --panel:#121A23; --panel-2:#18222D; --line:#253241; --ink:#E9EEF4; --muted:#93A2B3;
    --accent:#E5525B; --accent-2:#F06A72; --accent-soft:rgba(229,82,91,.16); --good:#3DBA78; --warn:#F2B544;
    --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
    --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    /* LiveKit theme hooks */
    --lk-bg:var(--bg); --lk-bg2:var(--panel); --lk-bg3:var(--panel-2); --lk-bg4:#22303E; --lk-bg5:#2B3B4C;
    --lk-fg:var(--ink); --lk-accent-bg:var(--accent); --lk-accent-fg:#fff; --lk-danger:var(--accent);
    --lk-border-radius:14px; --lk-font-family:var(--f-body); --lk-control-bar-height:auto;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0}
  body{background:radial-gradient(1100px 500px at 50% -260px,rgba(229,82,91,.12),transparent 70%),var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
  [data-lk-theme]{background:transparent !important;font-family:var(--f-body)}
  button{font:inherit}
  .mono{font-family:var(--f-mono);font-size:.82em}
  svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* waiting screens */
  .wait{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .wait svg{width:44px;height:44px;stroke:none}
  .wait h1{font-family:var(--f-display);font-size:1.25rem;margin:4px 0 0}
  .wait p{color:var(--muted);margin:0;max-width:44ch;line-height:1.55}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600;text-decoration:none;cursor:pointer}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
  .spin.sm{width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* toast */
  .note{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:9999;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100vw - 32px);animation:drop .2s ease}
  .note.bad{border-color:var(--accent);background:#2A171A}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-6px)}}

  /* layout */
  .room{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:0 12px env(safe-area-inset-bottom)}
  .rtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px}
  .rbrand{display:flex;align-items:center;gap:10px;min-width:0}
  .rbrand svg{width:32px;height:32px;stroke:none}
  .rbrand div{display:flex;flex-direction:column;min-width:0}
  .rbrand b{font-family:var(--f-display);font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbrand span{color:var(--muted);font-size:.78rem}
  .rmeta{display:flex;align-items:center;gap:8px;flex:none}
  .live{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:#FFB3B7;border:1px solid rgba(229,82,91,.35);padding:5px 11px;border-radius:99px;font-size:.75rem;font-weight:700;letter-spacing:.06em}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(229,82,91,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(229,82,91,0)}100%{box-shadow:0 0 0 0 rgba(229,82,91,0)}}
  .rec{color:#fff;background:var(--accent);padding:5px 10px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.06em}
  .count{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:5px 11px;border-radius:99px;font-weight:700;font-size:.85rem;cursor:pointer}
  .count svg{width:17px;height:17px}

  .rbody{min-height:0;display:grid;grid-template-columns:1fr;gap:12px}
  .room.with-panel .rbody{grid-template-columns:1fr 340px}
  .stage{min-height:0;height:100%;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04)}
  .stage .lk-grid-layout{height:100%;padding:8px;gap:8px}
  .stage .lk-focus-layout{height:100%;padding:8px;gap:8px}
  .lk-participant-tile{border-radius:14px !important;background:var(--panel) !important;border:1px solid var(--line);overflow:hidden;transition:box-shadow .2s ease,border-color .2s ease}
  .lk-participant-tile[data-lk-speaking="true"]{border-color:var(--good) !important;box-shadow:0 0 0 2px var(--good) !important}
  .lk-participant-tile .lk-participant-metadata{padding:8px}
  .lk-participant-metadata-item{background:rgba(11,16,22,.72) !important;border-radius:8px !important;padding:3px 8px !important;font-size:.8rem;font-weight:600}
  .lk-participant-placeholder{background:radial-gradient(circle at 50% 40%,#1E2A37,var(--panel)) !important}
  .lk-participant-placeholder svg{width:auto !important;height:38% !important;max-height:150px;opacity:.3}
  .lk-focus-toggle-button{border-radius:8px !important}

  /* side panel */
  .side{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
  .tabs2{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
  .tabs2 button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:8px;cursor:pointer}
  .tabs2 button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
  .iconbtn{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{background:var(--panel-2);color:var(--ink)}
  .sidebody{flex:1;min-height:0;display:flex;flex-direction:column}
  .sidebody .lk-chat{width:100% !important;height:100%;background:transparent !important;border:0 !important;display:flex;flex-direction:column}
  .sidebody .lk-chat-header{display:none}
  .sidebody .lk-chat-messages{flex:1;padding:12px;gap:10px}
  .lk-chat-entry .lk-message-body{background:var(--panel-2) !important;border-radius:12px !important;padding:8px 11px !important;font-size:.9rem;line-height:1.45}
  .lk-chat-entry[data-lk-message-origin="local"] .lk-message-body{background:var(--accent-soft) !important}
  .lk-chat-entry .lk-meta-data{font-size:.72rem;color:var(--muted)}
  .lk-chat-form{padding:10px !important;border-top:1px solid var(--line) !important;gap:8px}
  .lk-chat-form-input{background:var(--bg) !important;border:1px solid var(--line) !important;border-radius:10px !important;color:var(--ink) !important;padding:10px 12px !important}
  .lk-chat-form-button{background:var(--accent) !important;color:#fff !important;border-radius:10px !important;font-weight:600}
  .people{list-style:none;margin:0;padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .people li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
  .people li.up{background:rgba(242,181,68,.1)}
  .av{width:32px;height:32px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
  .pname{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pname em{font-style:normal;font-size:.68rem;font-weight:700;color:var(--accent-2);background:var(--accent-soft);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
  .dot{font-size:.68rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;white-space:nowrap}
  .dot.on{color:var(--good);border-color:rgba(61,186,120,.35)}
  .handflag{font-size:1rem}
  .chipbtn{border:1px solid rgba(242,181,68,.5);background:rgba(242,181,68,.12);color:var(--warn);border-radius:99px;padding:3px 9px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap}

  .handsbar{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--warn);color:#2A1D00;border:0;border-radius:99px;padding:9px 16px;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer;animation:drop .2s ease}

  /* dock */
  .dock{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px 14px;flex-wrap:wrap}
  .dock .group{display:flex;gap:8px;align-items:center}
  .combo{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .combo .dbtn{border:0;background:none}
  .combo .dmenu{background:none;border:0;border-left:1px solid var(--line);border-radius:0 14px 14px 0;padding:0 7px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .combo .dmenu:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  .combo .dmenu svg{width:16px;height:16px}
  .dbtn,.lk-button.dbtn{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:74px;height:62px;padding:8px 10px;background:var(--panel) !important;border:1px solid var(--line) !important;color:var(--ink) !important;border-radius:14px !important;font-weight:600;font-size:.74rem;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .1s ease}
  .dbtn:hover:not(:disabled){background:var(--panel-2) !important}
  .dbtn:active:not(:disabled){transform:translateY(1px)}
  .dbtn:disabled{opacity:.45;cursor:not-allowed}
  .dbtn svg,.lk-button.dbtn svg{width:21px;height:21px}
  .dbtn.on,.lk-button.dbtn[aria-pressed="true"]{background:var(--accent-soft) !important;border-color:rgba(229,82,91,.5) !important;color:#FFC9CC !important}
  /* Mic and camera: "pressed" means ON for LiveKit toggles — keep them neutral, and red when OFF */
  .combo .lk-button.dbtn[data-lk-source="microphone"][aria-pressed="true"],.combo .lk-button.dbtn[data-lk-source="camera"][aria-pressed="true"]{background:none !important;color:var(--ink) !important;border:0 !important}
  .combo:has(.lk-button.dbtn[aria-pressed="false"]){background:#3A1B1F;border-color:rgba(229,82,91,.55)}
  .combo .lk-button.dbtn[aria-pressed="false"]{color:#FFB3B7 !important}
  .lk-button.dbtn[data-lk-source="screen_share"][aria-pressed="true"]{background:#16352A !important;border-color:rgba(61,186,120,.5) !important;color:#A8F0C9 !important}
  .dbtn.leave{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff !important;min-width:96px}
  .dbtn.leave:hover{background:var(--accent-2) !important}
  .dbtn.leave svg{transform:rotate(135deg)}
  .badge{position:absolute;top:5px;right:8px;background:var(--accent);color:#fff;border-radius:99px;font-size:.66rem;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
  .lk-device-menu{background:var(--panel-2) !important;border:1px solid var(--line) !important;border-radius:12px !important;padding:6px !important}
  .lk-media-device-select li>.lk-button{border-radius:8px !important;font-size:.85rem}

  /* background picker */
  .popwrap{position:relative}
  .bgpanel{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);z-index:70;width:330px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:drop .15s ease}
  .bghead{font-weight:700;font-size:.85rem;margin:0 2px 10px;display:flex;align-items:center;gap:8px}
  .bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bgopt{background:none;border:2px solid transparent;border-radius:12px;color:var(--ink);font-size:.74rem;font-weight:600;padding:4px;display:flex;flex-direction:column;gap:5px;align-items:center;cursor:pointer}
  .bgopt:hover:not(:disabled){background:rgba(255,255,255,.04)}
  .bgopt.on{border-color:var(--accent)}
  .bgopt:disabled{opacity:.6;cursor:progress}
  .bgthumb{width:100%;aspect-ratio:16/10;border-radius:8px;background:var(--bg) center/cover;display:grid;place-items:center;color:var(--muted)}
  .bgthumb.t-blur{background:linear-gradient(135deg,#3B4A5C,#6C7A8B 50%,#3B4A5C);filter:saturate(.8)}
  .bgthumb.t-blur::after{content:"";width:28%;aspect-ratio:1;border-radius:50%;background:#C9D3DD;box-shadow:0 0 14px 6px rgba(201,211,221,.6)}

  .startaudio{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;background:var(--accent) !important;color:#fff !important;border-radius:12px !important;padding:12px 18px !important;font-weight:700}
  .lk-toast{background:var(--panel-2) !important;border:1px solid var(--line) !important;border-radius:12px !important}

  /* phones */
  @media (max-width:820px){
    .room{padding:0 8px env(safe-area-inset-bottom)}
    .room.with-panel .rbody{grid-template-columns:1fr}
    .side{position:fixed;inset:auto 0 0 0;height:72vh;z-index:90;border-radius:18px 18px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.55)}
    .dock{justify-content:center;gap:6px;padding:10px 0 12px}
    .dock .group{gap:6px}
    .dbtn,.lk-button.dbtn{min-width:52px;height:52px;padding:6px}
    .dbtn .lbl{display:none}
    .dbtn.leave{min-width:56px}
    .hide-sm{display:none !important}
    .combo .dmenu{display:none}
    .rbrand span{display:none}
    .bgpanel{position:fixed;left:8px;right:8px;bottom:84px;transform:none;width:auto}
    .handsbar{bottom:80px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/class.jsx"></script>
</body>
</html>
